# Render Blueprint for Cosign (PayPal SANDBOX only). Nothing here is a secret:
# secret values are entered in the Render dashboard (sync: false) or generated.
# Plans are paid on purpose: a free database expires after 30 days (during
# judging) and a free web service sleeps after 15 idle minutes.
services:
  - type: web
    name: cosign
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate:deploy && pnpm db:seed:deploy
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: DATABASE_URL
        fromDatabase:
          name: cosign-db
          property: connectionString
      - key: APP_URL # the public https URL, no trailing slash
        sync: false
      - key: AUTH_URL # same as APP_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: AUTH_RESEND_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: DEMO_LOGIN
        value: "on"

  # Daily: period roll-over, renewal reminders, expired approvals, hold renewals.
  - type: cron
    name: cosign-daily
    runtime: node
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: "true"
    startCommand: curl -fsS -X POST "$APP_URL/api/jobs/daily" -H "Authorization: Bearer $JOB_SECRET"
    envVars:
      - key: APP_URL
        sync: false
      - key: JOB_SECRET
        fromService:
          type: web
          name: cosign
          envVarKey: JOB_SECRET

databases:
  - name: cosign-db
    plan: basic-256mb
    databaseName: cosign
    user: cosign
